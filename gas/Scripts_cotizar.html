<script>
    console.log('[LOAD] Scripts_Cotizar OK');
    window.rechazarOpcionIndividual = async (optionIds) => {
        const ids = optionIds.split(',').filter(Boolean);
        const { isConfirmed } = await Swal.fire({ title: 'Rechazar esta opción', text: '¿Estás seguro?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Rechazar', cancelButtonText: 'Cancelar' });
        if (!isConfirmed) return;
        showLoading("Rechazando...");
        const res = await apiCall('rejectSpecificOptions', { idTicket: idTicketEnFoco, optionIds: ids });
        if (res.status === "success") {
            await refreshDashboardSilencioso();
            await openDetalles(idTicketEnFoco);
            Toast.fire({ text: 'Opción rechazada', icon: 'success', timer: 2000, showConfirmButton: false });
        } else Toast.fire({ text: res.message, icon: 'error' });
        hideLoading();
    };

    // Eliminar un extra
    window.eliminarExtra = async (idOpcion) => {
        const { isConfirmed } = await Swal.fire({ title: 'Eliminar Extra', text: '¿Eliminar este cargo extra?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar' });
        if (!isConfirmed) return;
        showLoading("Eliminando...");
        const res = await apiCall('deleteExtra', { idTicket: idTicketEnFoco, idOpcion });
        hideLoading();
        if (res.status === "success") {
            await refreshDashboardSilencioso();
            await openDetalles(idTicketEnFoco);
        } else Toast.fire({ text: res.message, icon: 'error' });
    };

    // rechazarTramoEspecifico: rechaza solo las opciones de un servicio específico
    window.rechazarTramoEspecifico = async (nombreTramo) => {
        const { value: motivo } = await Toast.fire({ title: 'Rechazar Trayecto', text: `Motivo para:\n${nombreTramo}`, input: 'text', showCancelButton: true, confirmButtonText: 'Rechazar', cancelButtonText: 'Cancelar' });
        if (!motivo?.trim()) return;
        const motivoFinal = `[Rechazo: ${nombreTramo}] Motivo: ${motivo}`;
        closeModal('modal-detalles'); showLoading("Rechazando...");
        const res = await apiCall('rejectOptions', { idTicket: idTicketEnFoco, motivo: motivoFinal });
        if (res.status === "success") { sendAppNotifications("RECHAZADO", idTicketEnFoco, motivoFinal).catch(() => { }); await refreshDashboardSilencioso(); }
        else Toast.fire({ text: res.message, icon: "error" });
        hideLoading();
    };

    // rechazarTodas: rechaza TODAS las propuestas (corregía la función faltante)
    window.rechazarTodas = async () => {
        const { value: motivo } = await Toast.fire({ title: 'Rechazar Todas las Opciones', text: 'Indica brevemente el motivo para rechazar todas las propuestas:', input: 'text', showCancelButton: true, confirmButtonText: 'Rechazar Todo', cancelButtonText: 'Cancelar' });
        if (!motivo?.trim()) return;
        const motivoFinal = `[Rechazo Total] ${motivo}`;
        closeModal('modal-detalles'); showLoading("Rechazando...");
        const res = await apiCall('rejectOptions', { idTicket: idTicketEnFoco, motivo: motivoFinal });
        if (res.status === "success") { sendAppNotifications("RECHAZADO", idTicketEnFoco, motivoFinal).catch(() => { }); await refreshDashboardSilencioso(); }
        else Toast.fire({ text: res.message, icon: "error" });
        hideLoading();
    };

    window.ajustarPrecio = async () => {
        const opts = localData.ticketEnFoco.opciones.filter(o => o[6] === 'Autorizada');
        if (opts.length === 0) return Toast.fire({ text: "No hay opciones autorizadas para ajustar.", icon: "info" });
        const ajustes = [];
        for (const op of opts) {
            const { value: nuevoCosto } = await Toast.fire({ title: 'Ajustar Costo Base', html: `<p class="text-xs">Actual: <span class="font-black">${formatCurrency(op[3])}</span></p>`, input: 'number', inputValue: op[3], showCancelButton: true, confirmButtonText: 'Siguiente' });
            if (nuevoCosto === undefined || nuevoCosto === null) return;
            const { value: nuevoFee } = await Toast.fire({ title: 'Ajustar Fee', html: `<p class="text-xs">Actual: <span class="font-black">${formatCurrency(op[4])}</span></p>`, input: 'number', inputValue: op[4], showCancelButton: true, confirmButtonText: 'Guardar' });
            if (nuevoFee === undefined || nuevoFee === null) return;
            ajustes.push({ idOpcion: op[1], nuevoCosto: Number(nuevoCosto), nuevoFee: Number(nuevoFee), nuevoTotal: (Number(nuevoCosto) + Number(nuevoFee)) * 1.16 });
        }
        const { isConfirmed } = await Toast.fire({ title: '¿Aplicar ajustes?', text: "Se actualizará la tarifa de esta opción.", icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, aplicar' });
        if (!isConfirmed) return;
        closeModal('modal-detalles'); showLoading("Ajustando...");
        const res = await apiCall('ajustarPrecio', { idTicket: idTicketEnFoco, ajustes });
        if (res.status === "success") { await refreshDashboardSilencioso(); }
        else Toast.fire({ text: res.message, icon: "error" });
        hideLoading();
    };

    window.markPurchased = async () => {
        // Reset comprobante variables and UI
        window._comprobanteUrl = null;
        const uploadLabel = document.getElementById('comprobante-upload-label');
        if (uploadLabel) {
            uploadLabel.innerHTML = `<span id="comprobante-upload-text" class="text-[10px] font-black text-indigo-600">📎 Subir captura o comprobante de compra</span><input type="file" id="comprobante-file-input" class="hidden" accept="image/*" onchange="uploadComprobanteCompra(this)">`;
        }

        const optsAutorizadas = (localData.ticketEnFoco?.opciones || []).filter(o => o[6] === 'Autorizada');
        const vuelosAutorizados = optsAutorizadas.filter(o => {
            const svc = (localData.ticketEnFoco?.servicios || []).find(s => s[7] === o[7]);
            return svc && svc[1] === 'VUELO';
        });

        if (vuelosAutorizados.length === 0) {
            const { isConfirmed } = await Toast.fire({
                title: '¿Marcar como Comprado?',
                text: "Confirmas que los servicios fueron emitidos/pagados.",
                icon: 'question', showCancelButton: true, confirmButtonText: 'Sí, confirmar'
            });
            if (!isConfirmed) return;
            await ejecutarCompra();
            return;
        }

        // ── Helpers para parsear el HTML del desc ──────────────────────────────────
        // Formato guardado:
        // <p><b>Ruta:</b> MEX ➔ CUN</p>
        // <p><b>Fecha:</b> 2025-01-10 | <b>Horario:</b> 08:00 - 10:30</p>
        // <p><b>Vuelo:</b> AM500 | <b>PNR:</b> <span class="font-mono ...">X7B9M2</span></p>
        const parseCampo = (desc, etiqueta) => {
            const m = desc.match(new RegExp('<b>' + etiqueta + ':<\\/b>\\s*([^<|]+)', 'i'));
            return m ? m[1].trim() : '';
        };
        const parsePNR = (desc) => {
            const m = desc.match(/<span[^>]*font-mono[^>]*>([^<]*)<\/span>/i);
            return m ? m[1].trim() : '';
        };

        // Poblar el modal
        const container = document.getElementById('pnr-fields-container');
        container.innerHTML = vuelosAutorizados.map((o, idx) => {
            const desc = String(o[2] || '');
            const ruta = parseCampo(desc, 'Ruta');
            const fecha = parseCampo(desc, 'Fecha');
            const horario = parseCampo(desc, 'Horario');
            const vueloActual = parseCampo(desc, 'Vuelo').replace(/\|.*/, '').trim();
            const pnrActual = parsePNR(desc);
            const isPendiente = !pnrActual || pnrActual.toUpperCase() === 'PENDIENTE';

            return `<div class="bg-white rounded-2xl border ${isPendiente ? 'border-amber-300' : 'border-slate-200'} p-5 shadow-sm">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-lg"></span>
        <div>
          <p class="font-black text-slate-800 text-sm">${ruta || 'Vuelo ' + (idx + 1)}</p>
          <p class="text-[10px] text-slate-400 font-bold">${fecha} · ${horario}</p>
        </div>
        ${isPendiente ? '<span class="ml-auto text-[8px] font-black bg-amber-100 text-amber-700 px-2 py-1 rounded-full uppercase">PNR pendiente</span>' : ''}
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Numero de Vuelo</label>
          <input type="text" id="pnr-vuelo-${idx}"
            value="${vueloActual === 'Pendiente' ? '' : vueloActual}"
            placeholder="Ej. AM500"
            class="w-full border-b-2 border-slate-200 py-2 font-black text-slate-700 outline-none focus:border-indigo-500 uppercase text-sm bg-transparent">
        </div>
        <div>
          <label class="text-[9px] font-black text-indigo-600 uppercase tracking-widest block mb-1"> Clave de Reserva (PNR)</label>
          <input type="text" id="pnr-code-${idx}"
            value="${isPendiente ? '' : pnrActual}"
            placeholder="Ej. X7B9M2"
            class="w-full border-b-2 border-2 border-indigo-300 py-2 font-black text-indigo-700 outline-none focus:border-indigo-500 uppercase text-sm bg-indigo-50/30 rounded-lg px-2">
        </div>
      </div>
      <input type="hidden" id="pnr-optid-${idx}"    value="${o[1]}">
      <input type="hidden" id="pnr-origdesc-${idx}" value="${encodeURIComponent(desc)}">
    </div>`;
        }).join('');

        window._vuelosParaConfirmar = vuelosAutorizados;
        document.getElementById('modal-pnr').classList.remove('hidden');
    };

    window.confirmarCompraConPNR = async () => {
        const vuelos = window._vuelosParaConfirmar || [];
        const ajustes = [];

        vuelos.forEach((o, idx) => {
            const nuevoVuelo = (document.getElementById(`pnr-vuelo-${idx}`)?.value || '').toUpperCase().trim() || 'Pendiente';
            const nuevoPNR = (document.getElementById(`pnr-code-${idx}`)?.value || '').toUpperCase().trim() || 'Pendiente';
            const origDesc = decodeURIComponent(document.getElementById(`pnr-origdesc-${idx}`)?.value || '');

            // Reemplazar número de vuelo: entre <b>Vuelo:</b> y el primer | o <
            let nuevaDesc = origDesc.replace(
                /(<b>Vuelo:<\/b>\s*)([^|<]+)/i,
                (_, pre, _old) => pre + nuevoVuelo + ' '
            );
            // Reemplazar PNR: contenido del span font-mono
            nuevaDesc = nuevaDesc.replace(
                /(<span[^>]*font-mono[^>]*>)([^<]*)(<\/span>)/i,
                (_, open, _old, close) => open + nuevoPNR + close
            );

            if (nuevaDesc !== origDesc) ajustes.push({ idOpcion: o[1], nuevaDesc });
        });

        const btn = document.getElementById('btn-confirmar-compra');
        btn.disabled = true; btn.innerText = "GUARDANDO...";

        if (ajustes.length > 0) {
            const resPNR = await apiCall('updatePNR', { idTicket: idTicketEnFoco, ajustes });
            if (resPNR.status !== "success") {
                Toast.fire({ text: resPNR.message, icon: "error" });
                btn.disabled = false; btn.innerText = "✓ Confirmar Compra";
                return;
            }
        }

        btn.disabled = false; btn.innerText = "✓ Confirmar Compra";
        await ejecutarCompra();
    };

    async function ejecutarCompra() {
        closeModal('modal-pnr');
        closeModal('modal-detalles');
        showLoading("Marcando como comprado...");
        const res = await apiCall('markPurchased', { idTicket: idTicketEnFoco, comprobanteUrl: window._comprobanteUrl });
        if (res.status === "success") {
            sendAppNotifications("COMPRADO", idTicketEnFoco).catch(() => { });
            await refreshDashboardSilencioso();
            if (typeof window.exportarALegacy === 'function') {
                setTimeout(() => { window.exportarALegacy(); }, 500);
            }
        } else {
            Toast.fire({ text: res.message, icon: "error" });
        }
        hideLoading();
    }

    window.exportarALegacy = async () => {
        const { isConfirmed } = await Toast.fire({
            title: '¿Enviar a Orbix?',
            html: `<p class="text-sm text-slate-500 font-bold">Se crearan registros en las hojas <b>Viajes</b> y <b>Reservas</b> del Google Sheet legacy.<br><br>Esta accion se puede repetir si necesitas re-enviar.</p>`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, enviar',
            cancelButtonText: 'Cancelar'
        });
        if (!isConfirmed) return;

        const btn = document.getElementById('btn-exportar-legacy');
        if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Enviando...'; }

        showLoading("Enviando a Orbix...");
        const res = await apiCall('exportarALegacy', { idTicket: idTicketEnFoco });
        hideLoading();

        if (btn) { btn.disabled = false; btn.innerHTML = '🚀 Enviar a Orbix'; }

        if (res.status === 'success') {
            Swal.fire({
                title: '¡Enviado a Orbix!',
                html: `
        <p class="text-sm text-slate-600 font-bold mb-4">${res.data.mensaje}</p>
        <div class="text-left bg-slate-50 rounded-xl p-4 space-y-3">
          <div>
            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Viaje creado</p>
            <p class="font-mono text-xs text-slate-700">${res.data.viajes[0]}</p>
          </div>
          <div>
            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Reservas (${res.data.reservas.length})</p>
            <p class="font-mono text-xs text-slate-700">${res.data.reservas.join(', ')}</p>
          </div>
          <div>
            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Contactos procesados (${res.data.contactos.length})</p>
            <p class="font-mono text-xs text-slate-700">${res.data.contactos.join(', ')}</p>
          </div>
        </div>`,
                icon: 'success',
                showCloseButton: true,
                showConfirmButton: false
            });
        } else {
            Toast.fire({ text: res.message, icon: 'error' });
        }
    };

    window.generarItinerarioPDF = async () => {
        const { isConfirmed } = await Toast.fire({ title: 'Generar Itinerario', text: '¿Deseas generar el PDF del itinerario?', icon: 'question', showCancelButton: true, confirmButtonText: 'Sí, generar PDF', cancelButtonText: 'Cancelar' });
        if (!isConfirmed) return;
        closeModal('modal-detalles'); showLoading("Construyendo PDF...");
        const res = await apiCall('generateItineraryPDF', { idTicket: idTicketEnFoco });
        hideLoading();
        if (res.status === "success") {
            Swal.fire({ title: 'PDF Listo!', html: `<p class="text-sm text-slate-500 font-bold mb-4">El documento fue generado.</p><a href="${res.data.url}" target="_blank" class="bg-indipris-main text-white px-8 py-4 rounded-xl font-black shadow-lg uppercase tracking-widest text-xs inline-block hover:bg-pink-700 transition"> Descargar PDF</a>`, icon: 'success', showConfirmButton: false, showCloseButton: true });
        } else {
            Toast.fire({ text: res.message, icon: "error" });
        }
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // MODAL COTIZACIONES — CORREGIDO: no re-renderiza todo el DOM en cada cambio de input
    // Solo rebuilds el bloque de resumen de precios, no los inputs
    // ─────────────────────────────────────────────────────────────────────────────
    window.openOptModal = () => {
        document.getElementById('opt-idticket').value = idTicketEnFoco;
        currentOpcionesPorServicio = {};

        const nPax = (localData.ticketEnFoco.pasajeros || []).length || 1;
        const politica = localData.ticketEnFoco.politica;
        const getFeeForTipo = (tipo) => {
            if (!politica) return 300;
            const t = String(tipo).toUpperCase();
            if (t === 'VUELO') return politica.feeVuelo || 300;
            if (t === 'HOTEL') return politica.feeHotel || 300;
            if (t === 'BUS') return politica.feeBus || 300;
            return politica.feeOtro || 300;
        };

        // Parse existing option desc back to editable fields
        const parseExisting = (o) => {
            const desc = String(o[2] || '');
            const get = (re) => { const m = desc.match(re); return m ? m[1].trim() : ''; };
            const tramo = desc.includes('IDA</p>') ? 'IDA' : desc.includes('REGRESO</p>') ? 'REGRESO' : '';
            return {
                id: o[1] + '_edit_' + Math.random(),
                _existingId: o[1], // keep reference to update instead of create new
                tipo: 'VUELO', // will be overridden
                desc: desc.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(),
                costo: String(o[3] || ''),
                fee: String(o[4] || ''),
                img: o[8] || '',
                costoProveedor: String(o[9] || ''),
                isUploadingImg: false,
                v_aerolinea: get(/Aerolinea:<\/b>\s*([^<]+)/i),
                v_fecha: get(/Fecha:<\/b>\s*([^\s|<]+)/i),
                v_origen: get(/Ruta:<\/b>\s*([^-<>\s]+)/i),
                v_destino: get(/Ruta:<\/b>\s*[^>]*->\s*([^<]+)/i),
                v_hSalida: '',
                v_hLlegada: '',
                v_num: get(/Vuelo:<\/b>\s*([^|<]+)/i),
                v_pnr: get(/PNR:<\/b>\s*(?:<[^>]+>)*\s*([^<]+)/i),
                v_comentario: get(/italic[^>]*>\s*([^<]+)/i),
                h_nombre: get(/Hotel:<\/b>\s*([^<]+)/i),
                h_dir: get(/Direccion:<\/b>\s*([^<]+)/i),
                h_desayuno: get(/Regimen:<\/b>\s*([^<]+)/i) || 'Desayuno Incluido',
                _tramo: tramo,
                _parentSvcId: null
            };
        };

        // Check for existing Propuesta options
        const existingOpts = (localData.ticketEnFoco.opciones || []).filter(o => o[6] === 'Propuesta');

        // Extract horario from parsed desc
        const parseHorario = (desc) => {
            const m = String(desc).match(/Horario:<\/b>\s*(\S+)\s*-\s*(\S+)/i);
            return m ? [m[1], m[2]] : ['', ''];
        };

        localData.ticketEnFoco.servicios.forEach((s, idx) => {
            const svcId = s[7] || ('old_svc_' + idx);
            const tipo = s[1];
            const detalles = String(s[6] || '');
            const esRedondo = tipo === 'VUELO' && detalles.toLowerCase().includes('redondo');
            const origen = String(s[2] || '').toUpperCase();
            const destino = String(s[3] || '').toUpperCase();
            const fechaIn = formatToDateInput(s[4]) || '';
            const fechaOut = formatToDateInput(s[5]) || '';
            const feeInicial = String(getFeeForTipo(tipo) * nPax);

            // Find existing options for this service
            const svcExisting = existingOpts.filter(o => o[7] === svcId);

            if (esRedondo) {
                const svcIda = svcId + '_IDA';
                const svcReg = svcId + '_REG';

                const existIda = svcExisting.filter(o => String(o[2]).includes('IDA</p>'));
                const existReg = svcExisting.filter(o => String(o[2]).includes('REGRESO</p>'));

                if (existIda.length > 0) {
                    currentOpcionesPorServicio[svcIda] = existIda.map(o => {
                        const parsed = parseExisting(o);
                        const [hS, hL] = parseHorario(o[2]);
                        return { ...parsed, tipo: 'VUELO', v_hSalida: hS, v_hLlegada: hL, _parentSvcId: svcId, _tramo: 'IDA' };
                    });
                } else {
                    currentOpcionesPorServicio[svcIda] = [{
                        id: Date.now() + Math.random(), tipo: 'VUELO',
                        desc: '', costo: '', fee: feeInicial, img: '', costoProveedor: '', isUploadingImg: false,
                        v_fecha: fechaIn, v_origen: origen, v_destino: destino,
                        v_hSalida: '', v_hLlegada: '', v_num: '', v_pnr: '', v_aerolinea: '', v_comentario: '',
                        h_nombre: '', h_dir: '', h_desayuno: 'Desayuno Incluido',
                        _parentSvcId: svcId, _tramo: 'IDA'
                    }];
                }

                if (existReg.length > 0) {
                    currentOpcionesPorServicio[svcReg] = existReg.map(o => {
                        const parsed = parseExisting(o);
                        const [hS, hL] = parseHorario(o[2]);
                        return { ...parsed, tipo: 'VUELO', v_hSalida: hS, v_hLlegada: hL, _parentSvcId: svcId, _tramo: 'REGRESO' };
                    });
                } else {
                    currentOpcionesPorServicio[svcReg] = [{
                        id: Date.now() + Math.random() + 1, tipo: 'VUELO',
                        desc: '', costo: '', fee: feeInicial, img: '', costoProveedor: '', isUploadingImg: false,
                        v_fecha: fechaOut, v_origen: destino, v_destino: origen,
                        v_hSalida: '', v_hLlegada: '', v_num: '', v_pnr: '', v_aerolinea: '', v_comentario: '',
                        h_nombre: '', h_dir: '', h_desayuno: 'Desayuno Incluido',
                        _parentSvcId: svcId, _tramo: 'REGRESO'
                    }];
                }
            } else {
                if (svcExisting.length > 0) {
                    currentOpcionesPorServicio[svcId] = svcExisting.map(o => {
                        const parsed = parseExisting(o);
                        const [hS, hL] = parseHorario(o[2]);
                        return { ...parsed, tipo, v_hSalida: hS, v_hLlegada: hL };
                    });
                } else {
                    currentOpcionesPorServicio[svcId] = [{
                        id: Date.now() + Math.random(), tipo,
                        desc: '', costo: '', fee: feeInicial, img: '', costoProveedor: '', isUploadingImg: false,
                        v_fecha: fechaIn, v_origen: origen, v_destino: destino,
                        v_hSalida: '', v_hLlegada: '', v_num: '', v_pnr: '', v_aerolinea: '',
                        h_nombre: tipo === 'HOTEL' ? origen : '', h_dir: tipo === 'HOTEL' ? destino : '',
                        h_desayuno: 'Desayuno Incluido'
                    }];
                }
            }
        });

        renderOptModal();
        // Set IVA checkbox from empresa politica
        const ivaCheckbox = document.getElementById('opt-aplica-iva');
        if (ivaCheckbox) {
            const _pol = localData.ticketEnFoco.politica;
            ivaCheckbox.checked = _pol ? _pol.aplicaIVA !== false : true;
        }
        document.getElementById('modal-opt').classList.remove('hidden');
    };

    window.addOpcionSlot = (svcId, addPair = false) => {
        if (addPair) {
            _addSlot(svcId + '_IDA', false);
            const regId = _addSlot(svcId + '_REG', false);
            renderOptModal();
            setTimeout(() => {
                const el = document.getElementById('opt-slot-' + regId);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
            return;
        }
        const newId = _addSlot(svcId, false);
        renderOptModal();
        setTimeout(() => {
            const el = document.getElementById('opt-slot-' + newId);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    };

    function _addSlot(targetSvcId, doRender = false) {
        const existing = currentOpcionesPorServicio[targetSvcId];
        if (!existing) return null;
        const tipo = existing[0]?.tipo || 'BUS';
        const tramo = existing[0]?._tramo || null;
        const parentId = existing[0]?._parentSvcId || null;
        const nPax = (localData.ticketEnFoco.pasajeros || []).length || 1;
        const feeInicial = String(300 * nPax);
        if (existing.length >= 3) { Toast.fire({ text: "Máximo 3 opciones por tramo.", icon: "info" }); return null; }
        
        const newOptId = Date.now() + Math.random();
        existing.push({
            id: newOptId, tipo,
            desc: '', costo: '', fee: feeInicial, img: '', costoProveedor: '', isUploadingImg: false,

        currentOpcionesPorServicio[svcId] = currentOpcionesPorServicio[svcId].filter(o => String(o.id) !== String(optId));

    window.updateOpcion = (svcId, optId, field, value) => {
        const op = currentOpcionesPorServicio[svcId]?.find(o => String(o.id) === String(optId));
        if (!op) return;
        op[field] = value;
        if (field === 'costo' || field === 'fee') {
            _recalcPriceSummary(svcId, optId);
        }
    };

    // Recalcular resumen de precios respetando checkbox IVA
    function _recalcPriceSummary(svcId, optId) {
        const op = currentOpcionesPorServicio[svcId]?.find(o => String(o.id) === String(optId));
        if (!op) return;
        const nPax = (localData.ticketEnFoco.pasajeros || []).length || 1;
        const aplicaIVA = document.getElementById('opt-aplica-iva')?.checked ?? true;
        const c = Number(op.costo || 0);
        const f = Number(op.fee || 0);
        const sub = c + f;
        const iva = aplicaIVA ? sub * 0.16 : 0;
        const tot = sub + iva;
        const summary = document.getElementById(`price-summary-${optId}`);
        if (summary) summary.innerHTML = buildPriceSummaryHTML(f, nPax, sub, iva, tot, aplicaIVA);
    }

    document.addEventListener('change', (e) => {

            for (const svcId in currentOpcionesPorServicio) {
                (currentOpcionesPorServicio[svcId] || []).forEach(op => {
                    _recalcPriceSummary(svcId, op.id);
                });
            }
        }
    });

        const payloadOptions = [];
        for (const svcId in currentOpcionesPorServicio) {
            for (const op of currentOpcionesPorServicio[svcId]) {

                // Eliminamos la restricción. Si están vacíos, se convierten en 0 automáticamente.
                if (!op.costo) op.costo = 0;
                if (!op.fee) op.fee = 0;

                let finalDesc = op.desc;
                if (op.tipo === 'VUELO') {
                    if (!op.v_fecha || !op.v_origen || !op.v_destino) return Toast.fire({ text: "Faltan Fecha, Origen o Destino.", icon: "warning" });
                    if (!op.v_aerolinea || !op.v_aerolinea.trim()) return Toast.fire({ text: "La aerolínea es obligatoria en vuelos.", icon: "warning" });
                    const tramoLabel = op._tramo ? `<p class="text-[9px] font-black uppercase tracking-widest" style="color:#6366f1">${op._tramo === 'IDA' ? '-> IDA' : '<- REGRESO'}</p>` : '';
                    const comentarioHtml = op.comentario ? `<p class="mt-2 text-[10px] text-slate-500 italic border-t border-slate-100 pt-2"> ${op.comentario}</p>` : '';
                    finalDesc = `<div class="space-y-1">${tramoLabel}<p><b>Aerolinea:</b> ${op.v_aerolinea.trim()}</p><p><b>Ruta:</b> ${op.v_origen.toUpperCase()} -> ${op.v_destino.toUpperCase()}</p><p><b>Fecha:</b> ${op.v_fecha} | <b>Horario:</b> ${op.v_hSalida || 'TBA'} - ${op.v_hLlegada || 'TBA'}</p><p><b>Vuelo:</b> ${(op.v_num || 'Pendiente').toUpperCase()} | <b>PNR:</b> <span class="font-mono text-indipris-main font-black">${(op.v_pnr || 'Pendiente').toUpperCase()}</span></p>${comentarioHtml}</div>`;
                } else if (op.tipo === 'HOTEL') {
                    if (!op.h_nombre) return Toast.fire({ text: "Agrega el nombre del hotel.", icon: "warning" });
                    const comentarioHtml = op.comentario ? `<p class="mt-2 text-[10px] text-slate-500 italic border-t border-slate-100 pt-2"> ${op.comentario}</p>` : '';
                    finalDesc = `<div class="space-y-1"><p><b>Hotel:</b> ${op.h_nombre}</p><p><b>Direccion:</b> ${op.h_dir || 'No especificada'}</p><p><b>Regimen:</b> ${op.h_desayuno}</p>${comentarioHtml}</div>`;
                } else {
                    if (!op.desc) return Toast.fire({ text: "Agrega una descripción.", icon: "warning" });
                    const comentarioHtml = op.comentario ? `<p class="mt-2 text-[10px] text-slate-500 italic border-t border-slate-100 pt-2"> ${op.comentario}</p>` : '';
                    finalDesc = op.comentario ? `<div class="space-y-1"><p>${op.desc}</p>${comentarioHtml}</div>` : op.desc;
                }
                // Usar _parentSvcId si es un sub-slot de vuelo redondo, si no usar svcId directo
                const idServicioReal = op._parentSvcId || svcId;
                const ivaChecked = document.getElementById('opt-aplica-iva')?.checked ?? true;
                const ivaMultiplier = ivaChecked ? 1.16 : 1.0;
                payloadOptions.push({ idServicio: idServicioReal, desc: finalDesc, costo: op.costo, fee: op.fee, total: (Number(op.costo) + Number(op.fee)) * ivaMultiplier, img: op.img || '', costoProveedor: op.costoProveedor || 0, existingId: op._existingId || null });
            }
        }
        const btn = document.getElementById('btn-save-opt');
        btn.disabled = true; btn.innerText = "ENVIANDO...";
        const res = await apiCall('saveAllOptions', { idTicket: idTicketEnFoco, opciones: payloadOptions });
        if (res.status === "success") {
            // Notificaciones en background - no bloquear la UI
            sendAppNotifications("COTIZADO", idTicketEnFoco).catch(() => { });
            closeModal('modal-opt'); closeModal('modal-detalles');
            showLoading("Actualizando..."); await refreshDashboardSilencioso(); hideLoading();
            Toast.fire({ text: 'Cotización enviada al cliente', icon: 'success', timer: 2000, showConfirmButton: false });
        } else {
            Toast.fire({ text: res.message, icon: "error" });
        }
        btn.disabled = false; btn.innerText = "ENVIAR COTIZACIÓN AL CLIENTE";
    };

    /**
     * Comprime una imagen antes de subirla.
     * Devuelve un objeto { base64, mimeType } listo para enviar.
     * maxW/maxH: dimensión máxima en px. quality: 0-1 para JPEG.
     */
    function compressImage(file, maxW = 800, maxH = 800, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = reject;
            reader.onload = (e) => {
                const img = new Image();
                img.onerror = reject;
                img.onload = () => {
                    let { width, height } = img;
                    const ratio = Math.min(maxW / width, maxH / height, 1); // nunca agrandar
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                    // Siempre convertir a JPEG para máxima compresión
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    const base64 = dataUrl.split(',')[1];
                    resolve({ base64, mimeType: 'image/jpeg' });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    window.uploadOptionImage = async (svcId, optId, inputEl) => {
        const file = inputEl.files[0];
        if (!file) return;

        const op = currentOpcionesPorServicio[svcId].find(o => o.id === optId);
        if (!op) return;

        // Actualizar label sin re-render completo
        const label = inputEl.parentElement;
        label.innerHTML = `<span class="text-[10px] font-black text-slate-500"> Comprimiendo...</span>`;

        // Comprimir antes de enviar para que quepa en la celda de Sheets (~49KB límite)
        let compressed;
        try {
            compressed = await compressImage(file, 600, 600, 0.65);
        } catch (e) {
            Toast.fire({ text: "No se pudo procesar la imagen.", icon: "error" });
            label.innerHTML = `<span class="text-[10px] font-black text-slate-500"> Subir foto de referencia (Opcional)</span><input type="file" class="hidden" accept="image/*" onchange="uploadOptionImage('${svcId}',${optId},this)">`;
            return;
        }

        label.innerHTML = `<span class="text-[10px] font-black text-slate-500"> Subiendo...</span>`;

        const res = await apiCall('uploadFile', {
            fileName: `OPT_${idTicketEnFoco}_${file.name}`,
            mimeType: compressed.mimeType,
            base64: compressed.base64,
            mode: 'base64'
        });

        if (res.status === "success") {
            op.img = res.data.url; // data URI listo para <img src>
            label.innerHTML = `<img src="${op.img}" class="absolute inset-0 w-full h-full object-cover opacity-40"><span class="relative z-10 text-[10px] font-black text-pink-700"> Foto Subida</span><input type="file" class="hidden" accept="image/*" onchange="uploadOptionImage('${svcId}',${optId},this)">`;
            // Actualizar el resumen de precios por si acaso sin perder el estado
            const summary = document.getElementById(`price-summary-${optId}`);
            if (summary) { /* ya está al día, no hace falta re-calcular */ }
        } else {
            Toast.fire({ text: res.message || "Error al subir imagen.", icon: "error" });
            label.innerHTML = `<span class="text-[10px] font-black text-slate-500"> Subir foto de referencia (Opcional)</span><input type="file" class="hidden" accept="image/*" onchange="uploadOptionImage('${svcId}',${optId},this)">`;
        }
    };
