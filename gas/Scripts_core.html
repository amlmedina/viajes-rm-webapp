    const _memStore = {};
    const safeStorage = {
        getItem(k) { try { const v = localStorage.getItem(k); console.log('[DEBUG] localStorage.getItem OK'); return v; } catch (e) { console.warn('[DEBUG] localStorage blocked, using memory:', e.message); return _memStore[k] || null; } },

    async function apiCall(action, extraPayload = {}) {
        try {
            const authPayload = session ? { u: session.name, h: session.hash } : null;

    const showLoading = (txt) => {

    function parseDateObj(val) {
        if (!val) return new Date();
        let str = String(val).split(' ')[0];
        let parts = str.split('/');
        if (parts.length === 3) {
            let p0 = parseInt(parts[0], 10), p1 = parseInt(parts[1], 10) - 1, p2 = parseInt(parts[2], 10);
            if (p2 < 100) p2 += 2000;
            if (p0 > 31) return new Date(p0, p1, p2);
            return new Date(p2, p1, p0);
        }
        return new Date(val);
    }

    function formatToDateInput(dateStr) {
        if (!dateStr) return '';
        const str = String(dateStr).trim();
        const m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        const parts = str.split('/');
        if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        try { const d = new Date(str); if (!isNaN(d)) return d.toISOString().split('T')[0]; } catch (e) { }
        return dateStr;
    }

    // Formato legible: "10 - julio - 2002"
    const _MESES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    function formatDateHuman(dateStr) {
        if (!dateStr) return '—';
        const iso = formatToDateInput(dateStr);
        if (!iso) return '—';
        const [y, m, d] = iso.split('-').map(Number);
        if (!y || !m || !d) return iso;
        return `${d} - ${_MESES_ES[m - 1]} - ${y}`;
    }

    function formatCurrency(n) {
        return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n);
    }

    async function hashPassword(p) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
